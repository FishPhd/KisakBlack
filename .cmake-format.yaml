# cmake-lint / cmake-format (cmakelang). Cursor/CMake Tools pick this up
# from the workspace root. cmake_files.cmake is generated; do not format it.
format:
  line_width: 80
  tab_size: 2
  use_tabchars: false
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  dangle_parens: false
  line_ending: unix

lint:
  disabled_codes:
    - C0111
    - C0113
    - C0327
    - C0306
  function_pattern: "[0-9a-zA-Z_]+"
  macro_pattern: "[0-9a-zA-Z_]+"
  global_var_pattern: "[0-9a-zA-Z_]+"
  internal_var_pattern: "[0-9a-zA-Z_]+"
  local_var_pattern: "[0-9a-zA-Z_]+"
  private_var_pattern: "[0-9a-zA-Z_]+"
  public_var_pattern: "[0-9a-zA-Z_]+"
  argument_var_pattern: "[0-9a-zA-Z_]+"
  keyword_pattern: "[0-9a-zA-Z_]+"
