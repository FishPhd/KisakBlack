<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KisakBlack (WebAssembly)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  #web-console { position: absolute; inset: auto 0 0; height: min(50vh, 480px); z-index: 20; background: #101216f5; border-top: 1px solid #454b56; flex-direction: column; cursor: auto; }
  #web-console:not([hidden]) { display: flex; }
  #console-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid #303640; }
  #log { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  #log .err { color: #f0a070; }
  #console-form { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #303640; }
  #console-command { flex: 1; min-width: 0; background: #222731; color: inherit; border: 1px solid #454b56; padding: 6px; font: 13px ui-monospace, Consolas, monospace; }
  #map-load { position: absolute; inset: 0; z-index: 5; background: #0c0e12; color: #d8dce2; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #map-load:not([hidden]) { display: flex; }
  #map-load-name { font-size: 28px; letter-spacing: .14em; }
  #map-load-status { color: #9aa4b5; max-width: 46ch; text-align: center; }
  #map-load progress { width: 260px; accent-color: #4f8cff; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #14161a; color: #d8dce2; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  button { background: #222731; color: inherit; border: 1px solid #3a4150; border-radius: 4px; padding: 5px 10px; font: inherit; }
  button:hover:not(:disabled) { background: #2c3340; cursor: pointer; }
  button:disabled { opacity: .45; }
  button.primary { background: #2f5fd0; border-color: #4f7cf0; }
  button.primary:hover:not(:disabled) { background: #3a6fe8; }
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

  #stage { display: none; position: absolute; inset: 0; background: #000; align-items: center; justify-content: center; }
  body.playing #stage { display: flex; }
  #game { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; image-rendering: auto; outline: none; cursor: none; background: #000; }
  #load { position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0c0e12; color: #d8dce2; pointer-events: none; }
  body.playing.booting #load { display: flex; }
  #load .title { font-size: 28px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  #warmup { position: absolute; inset: 0; z-index: 9; background: #0c0e12e8; align-items: center; justify-content: center; flex-direction: column; gap: 16px; cursor: auto; }
  #warmup:not([hidden]) { display: flex; }
  #warmup progress { width: 260px; }
  #warmup.incomplete { inset: auto 12px 12px; padding: 12px; gap: 8px; background: #292014f2; border: 1px solid #80643d; }
  #load-status { max-width: 46ch; text-align: center; color: #9aa4b5; min-height: 1.4em; }
  #load .bar { width: 220px; height: 4px; background: #222731; border-radius: 2px; overflow: hidden; }
  #load .bar > div { width: 40%; height: 100%; background: #4f8cff; animation: load-slide 1.1s ease-in-out infinite; }
  @keyframes load-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  #hint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; background: #000b; border: 1px solid #3a4150; border-radius: 6px; color: #d8dce2; pointer-events: none; display: none; }
  #gpu { position: absolute; left: 8px; top: 8px; right: 8px; z-index: 6; padding: 8px 12px; background: #3a1d1dee; border: 1px solid #a05050; border-radius: 6px; }
  #room { display: none; }
  #party-shade { display: none; position: absolute; inset: 0; z-index: 3; background: #0c0e12f2; }
  #party { display: none; position: absolute; z-index: 7; top: 12px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); padding: 10px 12px; background: #14161aee; border: 1px solid #3a4150; border-radius: 8px; pointer-events: none; }
  #party-code { font-weight: 600; }
  #party a { color: #9ec1ff; pointer-events: auto; word-break: break-all; }
  #party button { pointer-events: auto; margin-top: 6px; }
  #party ul { margin: 6px 0 0; padding-left: 18px; }
  #party-meta, #party-wait { color: #9aa4b5; }
  body.playing.party-open #party { display: block; }
  body.playing.party-open #party { top: auto; bottom: 38px; left: auto; right: 12px; transform: none; width: auto; max-width: 300px; padding: 6px 10px; border-radius: 0; font-size: 12px; }
  #party-link, #party-meta, #party-roster { display: none; }
  #party-code { display: inline; margin-right: 8px; }
  body.playing.party-open #party { display: none; }
</style>
</head>
<body>
<div id="main">
  <div id="stage">
    <canvas id="game" tabindex="0"></canvas>
    <div id="load">
      <div class="title">KisakBlack</div>
      <div class="bar"><div></div></div>
      <div id="load-status">Loading…</div>
    </div>
    <div id="map-load" hidden role="status" aria-live="polite">
      <strong id="map-load-name"></strong>
      <span id="map-load-status">Loading map…</span>
      <progress id="map-load-progress" max="100"></progress>
      <button id="map-load-dismiss" hidden type="button">Dismiss</button>
    </div>
    <div id="gpu" hidden></div>
    <div id="warmup" hidden role="status" aria-live="polite">
      <strong id="warmup-title">Preparing graphics</strong>
      <span id="warmup-hint">Preparing shaders and static resources before play. This is not a coverage guarantee.</span>
      <progress id="warmup-progress" max="1" value="0"></progress>
      <span id="warmup-status"></span>
      <span id="warmup-reason" hidden style="max-width:min(560px,90vw);text-align:center"></span>
      <button id="warmup-cancel" type="button">Skip preparation</button>
    </div>
    <div id="room"></div>
    <div id="party-shade"></div>
    <div id="party">
      <div id="party-title">Private match</div>
      <div id="party-code"></div>
      <a id="party-link" href=""></a>
      <div><button id="party-copy" type="button">Copy link</button></div>
      <div id="party-meta"></div>
      <ul id="party-roster"></ul>
      <div id="party-wait"></div>
    </div>
    <section id="web-console" hidden aria-label="Game console">
      <div id="console-toolbar"><strong>Game console</strong><div><button id="console-copy" type="button">Copy logs</button> <button id="console-close" type="button">Close (F2)</button></div></div>
      <pre id="log" role="log" aria-label="Game logs"></pre>
      <form id="console-form" autocomplete="off"><input id="console-command" aria-label="Console command" placeholder="Enter a game command…" spellcheck="false"><button type="submit">Send</button></form>
    </section>
  </div>
</div>
<script type="module" src="./kisak.js"></script>
</body>
</html>
