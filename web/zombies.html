<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KisakBlack — Zombies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #14161a; color: #d8dce2; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { padding: 10px 14px; border-bottom: 1px solid #2a2e36; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  button, select, input[type=text], input[type=number] { background: #222731; color: inherit; border: 1px solid #3a4150; border-radius: 4px; padding: 5px 10px; font: inherit; }
  input[type=number] { width: 4.5em; }
  button:hover:not(:disabled) { background: #2c3340; cursor: pointer; }
  button:disabled { opacity: .45; }
  body[data-boot="zombies"] #start { display: none; }
  #multiplayer { color: inherit; text-decoration: none; border: 1px solid #3a4150; border-radius: 4px; padding: 5px 10px; }
  #multiplayer:hover { background: #2c3340; }
  button.primary { background: #2f5fd0; border-color: #4f7cf0; }
  button.primary:hover:not(:disabled) { background: #3a6fe8; }
  label { display: inline-flex; align-items: center; gap: 5px; }
  #bar { flex: 1 1 220px; min-width: 160px; height: 8px; background: #222731; border-radius: 4px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #4f8cff; transition: width .15s; }
  #status { padding: 6px 14px; color: #9aa4b5; border-bottom: 1px solid #2a2e36; min-height: 1.4em; white-space: pre-wrap; }
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #log { flex: 1; margin: 0; padding: 10px 14px; overflow: auto; font: 12px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  #log .err { color: #f0a070; }
  form { display: flex; gap: 8px; padding: 8px 14px; border-top: 1px solid #2a2e36; }
  #cmd { flex: 1; font-family: ui-monospace, Consolas, monospace; }
  #arg { width: min(52ch, 90vw); font-family: ui-monospace, Consolas, monospace; }

  /* play mode: the canvas fills the page, the log becomes an overlay toggled with the ~ button */
  body.playing header, body.playing #status { display: none; }
  body.playing.chrome header, body.playing.chrome #status { display: flex; position: absolute; z-index: 5; left: 0; right: 0; background: #14161aee; }
  body.playing.chrome #status { top: 52px; display: block; }
  #stage { display: none; position: absolute; inset: 0; background: #000; align-items: center; justify-content: center; }
  body.playing #stage { display: flex; }
  #game { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; image-rendering: auto; outline: none; cursor: none; background: #000; }
  #load { position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0c0e12; color: #d8dce2; pointer-events: none; }
  body.playing.booting #load { display: flex; }
  #load .title { font-size: 28px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  #warmup { position: absolute; inset: 0; z-index: 9; background: #0c0e12e8; align-items: center; justify-content: center; flex-direction: column; gap: 16px; cursor: auto; }
  #warmup:not([hidden]) { display: flex; }
  #warmup progress { width: 260px; }
  #warmup.incomplete { inset: auto 12px 12px; padding: 12px; gap: 8px; background: #292014f2; border: 1px solid #80643d; }
  #load-status { max-width: 46ch; text-align: center; color: #9aa4b5; min-height: 1.4em; }
  #load .bar { width: 220px; height: 4px; background: #222731; border-radius: 2px; overflow: hidden; }
  #load .bar > div { width: 40%; height: 100%; background: #4f8cff; animation: load-slide 1.1s ease-in-out infinite; }
  @keyframes load-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  #hint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; background: #000b; border: 1px solid #3a4150; border-radius: 6px; color: #d8dce2; pointer-events: none; display: none; }
  #fps { position: absolute; right: 8px; top: 6px; font: 11px ui-monospace, Consolas, monospace; color: #9fe39f; text-shadow: 0 0 3px #000; pointer-events: none; }
  #gpu { position: absolute; left: 8px; top: 8px; right: 8px; z-index: 6; padding: 8px 12px; background: #3a1d1dee; border: 1px solid #a05050; border-radius: 6px; }
  #room { display: none; }
  #fps { display: none; }
  #tools { position: absolute; right: 8px; bottom: 8px; display: none; gap: 6px; z-index: 8; }
  body.playing #log, body.playing #form, body.playing header, body.playing #status { display: none; }
  body.playing.booting #status { display: block; position: absolute; z-index: 7; left: 0; right: 0; top: 0; background: #14161aee; }
  /* F1: page debug chrome over the game. F2: the log, which can be closed again with F2. */
  body.playing.debug header { display: flex; position: absolute; z-index: 7; left: 0; right: 0; top: 0; background: #14161aee; }
  body.playing.debug #status { display: block; position: absolute; z-index: 7; left: 0; right: 0; top: 52px; background: #14161aee; }
  body.playing.debug #room { display: block; position: absolute; z-index: 7; left: 8px; top: 96px; right: auto; max-width: 42ch; padding: 6px 10px; background: #14161aee; border: 1px solid #3a4150; border-radius: 6px; }
  body.playing.debug #fps { display: block; }
  body.playing.debug #tools { display: flex; }
  body.playing.debug.logshown #log { display: block; position: absolute; left: 0; right: 0; bottom: 46px; height: 36%; background: #000d; z-index: 7; }
  body.playing.debug.logshown #form { display: flex; position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; background: #14161a; }
</style>
</head>
<body data-boot="zombies" class="playing booting">
<header>
  <h1>KisakBlack — Zombies</h1>
  <a id="multiplayer" href="/">Multiplayer</a>
  <button id="play" class="primary" title="Open the Zombies menu">Play</button>
  <button id="start" title="Headless dedicated server (no rendering)">Start server</button>
  <button id="pick" title="Import the needed files from your Black Ops install (Chromium)">Choose game folder…</button>
  <label>Load
    <select id="mode">
      <option value="lazy">maps on demand</option>
      <option value="bulk">all map packs</option>
      <option value="all">download everything (full install)</option>
    </select>
  </label>
  <label>Resolution
    <select id="res">
      <option value="auto">fit window</option>
      <option value="1280x720">1280x720</option>
      <option value="1600x900">1600x900</option>
      <option value="1920x1080">1920x1080</option>
      <option value="960x540">960x540</option>
    </select>
  </label>
  <input id="arg" type="text" spellcheck="false" title="Engine command line (server mode)">
  <button id="reset" title="Delete the imported game files and the profile from this browser">Reset storage</button>
  <button id="hitch-report" title="Save frame hitches and overlapping asset/compiler work">Save hitch report</button>
  <div id="bar"><div></div></div>
</header>
<div id="status">Loading zombies…</div>
<div id="main">
  <div id="stage">
    <canvas id="game" tabindex="0"></canvas>
    <div id="load">
      <div class="title">Zombies</div>
      <div class="bar"><div></div></div>
      <div id="load-status">Loading zombies…</div>
    </div>
    <div id="gpu" hidden></div>
    <div id="warmup" hidden role="status" aria-live="polite">
      <strong id="warmup-title">Preparing graphics</strong>
      <span id="warmup-hint">Preparing shaders and static resources before play. This is not a coverage guarantee.</span>
      <progress id="warmup-progress" max="1" value="0"></progress>
      <span id="warmup-status"></span>
      <span id="warmup-reason" hidden style="max-width:min(560px,90vw);text-align:center"></span>
      <button id="warmup-cancel" type="button">Skip shader warming</button>
    </div>
    <div id="room"></div>
    <div id="fps"></div>
    <div id="tools">
      <button id="btn-log" title="Toggle the engine console / log">log</button>
      <button id="btn-full" title="Fullscreen">&#x26F6;</button>
    </div>
  </div>
  <pre id="log"></pre>
  <form id="form" autocomplete="off">
    <input id="cmd" type="text" placeholder="console command" spellcheck="false" disabled>
    <button id="send" disabled>Send</button>
  </form>
</div>
<script type="module">
import { bootZombies } from "/kisak.js";
const query = new URLSearchParams(location.search);
const target = new URL("/", location.href);
for (const key of ["assets", "gen", "ice", "net"])
  if (query.has(key)) target.searchParams.set(key, query.get(key));
document.querySelector("#multiplayer").href = target.href;
bootZombies();
</script>
</body>
</html>
